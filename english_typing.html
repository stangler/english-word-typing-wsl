<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 1-3 英単語タイピング確認テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f1e4;
    --line:#e3d8c3;
    --ink:#2f3b52;
    --ink-soft:#7d869a;
    --red:#d6473c;
    --blue:#5c7a99;
    --green:#6f8f6a;
    --gold:#c99a3b;
    --card:#fffdf8;
    --shadow:rgba(47,59,82,0.12);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic UI','Yu Gothic',sans-serif;
    background-color:var(--paper);
    background-image:repeating-linear-gradient(to bottom, transparent 0 39px, var(--line) 39px 40px);
    color:var(--ink);
    line-height:1.7;
    min-height:100vh;
  }
  .page{max-width:720px;margin:0 auto;padding:28px 18px 64px;}

  .eyebrow{
    font-size:.8rem;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin:0 0 18px;
  }

  /* ---------- common ---------- */
  .screen[hidden]{display:none;}
  h1.title{font-size:1.55rem;font-weight:900;margin:0 0 6px;}
  p.lead{margin:0 0 26px;color:var(--ink-soft);}

  .panel{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 4px 16px var(--shadow);
    padding:22px;
  }

  button{font-family:inherit;}
  .btn-primary,.btn-secondary{
    font-weight:700;font-size:1rem;
    padding:12px 26px;border-radius:10px;border:none;cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease, border-color .1s ease;
  }
  .btn-primary{background:var(--ink);color:var(--paper);margin-top:20px;}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 10px var(--shadow);}
  .btn-primary:active{transform:translateY(0);}
  .btn-primary:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none;}
  .btn-secondary{background:var(--card);color:var(--ink);border:2px solid var(--line);}
  .btn-secondary:hover{border-color:var(--ink-soft);}
  .btn-primary:focus-visible,.btn-secondary:focus-visible,.lesson-card:focus-visible{
    outline:3px solid var(--blue);outline-offset:2px;
  }

  /* ---------- start screen ---------- */
  .lesson-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    margin-bottom:24px;
  }
  .lesson-card{
    --accent:var(--ink);
    background:var(--card);
    border:none;
    border-top:6px solid var(--accent);
    border-radius:var(--radius);
    padding:18px 20px;
    text-align:left;
    cursor:pointer;
    box-shadow:0 2px 8px var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .lesson-card:hover{transform:translateY(-2px);box-shadow:0 6px 14px var(--shadow);}
  .lesson-card:active{transform:translateY(0);}
  .lesson-card[data-lesson="elementary"]{--accent:var(--ink-soft);}
  .lesson-card[data-lesson="all"]{--accent:var(--red);grid-column:1 / -1;}
  .lesson-card[data-lesson]:not([data-lesson="elementary"]):not([data-lesson="all"]){
    --accent:hsl(var(--hue,200),60%,50%);
  }
  .lesson-no{display:block;font-weight:900;font-size:1.15rem;}
  .lesson-count{display:block;color:var(--ink-soft);font-size:.88rem;margin-top:4px;}

  /* ---- elementary category panel ---- */
  .category-panel{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 2px 8px var(--shadow);
    padding:16px 18px;
    margin-bottom:20px;
    animation:fadeIn .2s ease;
  }
  .category-panel[hidden]{display:none;}
  .category-panel p{font-size:.88rem;font-weight:700;margin:0 0 10px;color:var(--ink-soft);}
  .category-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
    gap:8px;
  }
  .category-btn{
    font-family:inherit;
    font-size:.85rem;font-weight:700;
    padding:8px 10px;
    border:2px solid var(--line);
    border-radius:8px;
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    transition:transform .1s ease, border-color .1s ease, background .1s ease;
    text-align:center;
  }
  .category-btn:hover{transform:translateY(-1px);border-color:var(--ink-soft);}
  .category-btn:active{transform:translateY(0);}
  .category-btn.cat-all{--accent:var(--red);border-color:var(--red);color:var(--red);}
  .category-btn.cat-all:hover{background:var(--red);color:#fff;}

  .shuffle-toggle{
    display:flex;align-items:center;gap:8px;
    margin-bottom:26px;color:var(--ink-soft);font-size:.95rem;
    cursor:pointer;user-select:none;
  }
  .shuffle-toggle input{width:18px;height:18px;accent-color:var(--red);}

  /* ---------- quiz screen ---------- */
  .quiz-bar .lesson-tag-label{font-weight:700;color:var(--ink);white-space:nowrap;}
  .progress-track{flex:1 1 80px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:var(--gold);transition:width .3s ease;}
  .progress-count{white-space:nowrap;}
  .score-label{white-space:nowrap;font-weight:700;}
  .score-correct{color:var(--green);}
  .score-wrong{color:var(--red);margin-left:6px;}

  .card{
    position:relative;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 4px 16px var(--shadow);
    padding:26px 24px 26px 64px;
  }
  .card::before{
    content:'';position:absolute;top:14px;bottom:14px;left:46px;width:2px;
    background:var(--red);opacity:.5;
  }
  .ring-holes{
    position:absolute;left:16px;top:0;bottom:0;width:14px;
    display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;
    padding:24px 0;
  }
  .ring-holes span{
    display:block;width:13px;height:13px;border-radius:50%;
    background:var(--paper);box-shadow:inset 0 1px 3px rgba(0,0,0,.18);
  }

  .card-tags{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tag{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.76rem;font-weight:700;color:#fff;}
  .tag-blue{background:var(--blue);}
  .tag-green{background:var(--green);}

  .prompt-label{margin:0;font-size:.78rem;color:var(--ink-soft);letter-spacing:.06em;}
  .prompt-ja{margin:8px 0 26px;font-size:1.65rem;font-weight:700;line-height:1.55;min-height:2.2em;}

  .answer-row{position:relative;}
  #answer-input{
    width:100%;
    font-family:'JetBrains Mono','Consolas','Courier New',monospace;
    font-size:1.25rem;
    padding:10px 4px;
    border:none;border-bottom:3px solid var(--ink-soft);
    background:transparent;color:var(--ink);outline:none;
    transition:border-color .15s;
  }
  #answer-input:focus{border-color:var(--blue);}
  #answer-input.correct{border-color:var(--green);}
  #answer-input.incorrect{border-color:var(--red);}
  #answer-input:read-only{color:var(--ink-soft);}

  .mark{
    position:absolute;top:6px;right:0;width:84px;height:84px;
    pointer-events:none;opacity:0;transition:opacity .05s;
  }
  .mark.show{opacity:.92;}
  .mark path{fill:none;stroke:var(--red);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;}

  .feedback{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);animation:fadeIn .25s ease;}
  .feedback p{margin:0 0 6px;}
  .feedback-answer{font-weight:700;}
  .feedback-answer .ans{font-family:'JetBrains Mono','Consolas',monospace;color:var(--blue);font-weight:700;}
  .feedback-ex-en{font-family:'JetBrains Mono','Consolas',monospace;}
  .feedback-ex-ja{color:var(--ink-soft);font-size:.92rem;}
  .feedback-memo{font-size:.85rem;color:var(--gold);background:rgba(201,154,59,.14);padding:8px 10px;border-radius:8px;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

  .history-actions{display:flex;gap:8px;justify-content:flex-end;}

  /* ---------- result screen ---------- */

  /* ---------- result screen ---------- */
  .result-score{text-align:center;margin-bottom:20px;}
  .result-pct{font-size:3.2rem;font-weight:900;margin:0;line-height:1.2;color:var(--ink);}
  .result-pct .pct-num{font-size:4.8rem;}
  #result-fraction{font-size:1.05rem;font-weight:700;margin:6px 0 0;color:var(--ink-soft);}
  #result-message{color:var(--ink-soft);margin:12px 0 0;}

  .wrong-list{padding:6px 22px;margin-bottom:20px;}
  .wrong-list h2{font-size:.95rem;margin:8px 0 4px;}
  .wrong-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem;
  }
  .wrong-item:last-child{border-bottom:none;}
  .wrong-item .ja{color:var(--ink-soft);}
  .wrong-item .en{font-family:'JetBrains Mono','Consolas',monospace;font-weight:700;color:var(--blue);white-space:nowrap;}

  .result-actions{display:flex;flex-direction:column;gap:10px;}
  .result-actions .btn-primary{margin-top:0;}

  /* ---------- history detail screen ---------- */
  .history-detail-header{
    display:flex;align-items:center;gap:12px;
    margin-bottom:20px;
  }
  .history-detail-header h1{
    font-size:1.3rem;font-weight:900;margin:0;flex:1;
  }
  .chart-container{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 4px 16px var(--shadow);
    padding:16px;
    margin-bottom:20px;
    position:relative;
  }
  .chart-container canvas{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:2 / 1;
  }
  .chart-empty{
    text-align:center;padding:40px 0;
    color:var(--ink-soft);font-size:.95rem;
  }
  .history-detail-list{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 4px 16px var(--shadow);
    padding:6px 0;
    max-height:320px;
    overflow-y:auto;
  }
  .history-detail-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 18px;
    border-bottom:1px solid var(--line);
    font-size:.88rem;
    cursor:pointer;
    transition:background .1s;
  }
  .history-detail-item:last-child{border-bottom:none;}
  .history-detail-item:hover{background:rgba(92,122,153,.06);}
  .history-detail-item.highlight{
    background:rgba(201,154,59,.12);
    border-left:4px solid var(--gold);
  }
  .history-detail-item .date{color:var(--ink-soft);font-size:.82rem;margin-right:10px;white-space:nowrap;}
  .history-detail-item .lesson{font-weight:700;color:var(--ink);margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-detail-item .pct{
    font-weight:900;font-size:1rem;
    margin-left:8px;white-space:nowrap;
  }
  .history-detail-item .pct.high{color:var(--green);}
  .history-detail-item .pct.mid{color:var(--gold);}
  .history-detail-item .pct.low{color:var(--red);}
  .history-detail-item .detail-score{
    color:var(--ink-soft);font-size:.8rem;margin-left:4px;white-space:nowrap;
  }

  /* ---------- progress panel ---------- */
  .progress-panel{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 4px 16px var(--shadow);
    padding:16px 18px;
    margin-bottom:20px;
  }
  .progress-summary{
    margin:0 0 14px;font-size:.92rem;font-weight:700;color:var(--ink);
  }
  .progress-section{margin-bottom:14px;}
  .progress-section:last-child{margin-bottom:0;}
  .progress-section h3{
    margin:0 0 8px;font-size:.85rem;font-weight:700;color:var(--ink-soft);
  }
  .progress-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:8px;
  }
  .progress-badge{
    font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:.82rem;font-weight:700;
    padding:8px 6px;
    border:2px solid var(--line);
    border-radius:8px;
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    transition:transform .1s ease, border-color .1s ease, background .1s ease;
    text-align:center;
  }
  .progress-badge:hover{transform:translateY(-1px);}
  .progress-badge:active{transform:translateY(0);}
  .progress-badge.done{border-color:var(--green);}
  .progress-badge.todo{border-color:var(--line);color:var(--ink-soft);}
  .progress-badge .pb-pct{color:var(--green);font-weight:900;}
  .progress-badge .pb-count{color:var(--blue);font-weight:800;font-size:.78rem;}
  .progress-badge .pb-status{color:var(--ink-soft);font-weight:700;font-size:.78rem;}

  /* ---------- part statistics & filter ---------- */
  .stat-stats{display:flex;gap:10px;margin-bottom:18px;}
  .stat-stat{flex:1;background:var(--card);border-radius:var(--radius);box-shadow:0 2px 8px var(--shadow);padding:12px;text-align:center;}
  .stat-stat .stat-label{font-size:.78rem;color:var(--ink-soft);margin-bottom:4px;}
  .stat-stat .stat-value{font-size:1.6rem;font-weight:900;}
  .stat-stat .stat-value.green{color:var(--green);}
  .stat-stat .stat-value.gold{color:var(--gold);}
  .stat-stat .stat-value.blue{color:var(--blue);}
  .stat-filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .stat-filter-label{font-size:.85rem;font-weight:700;color:var(--blue);}
  .stat-clear-btn{font-size:.8rem;padding:4px 12px;border-radius:6px;border:2px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;font-weight:700;font-family:inherit;}
  .stat-section-label{font-size:.82rem;font-weight:700;color:var(--ink-soft);margin-bottom:8px;letter-spacing:.04em;}
  .stat-badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .stat-badge{font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);cursor:pointer;transition:all .15s;min-width:90px;text-align:center;font-size:.78rem;}
  .stat-badge:hover{border-color:var(--blue);transform:translateY(-1px);}
  .stat-badge.active{border-color:var(--blue);background:var(--blue);color:#fff;transform:translateY(-2px);box-shadow:0 3px 10px var(--shadow);}
  .stat-badge .sb-label{font-weight:700;margin-bottom:4px;}
  .stat-badge .sb-attempts{color:var(--blue);font-weight:800;}
  .stat-badge.active .sb-attempts{color:rgba(255,255,255,.8);}
  .stat-badge .sb-avg{color:var(--green);font-weight:700;}
  .stat-badge.active .sb-avg{color:rgba(255,255,255,.85);}
  .stat-badge .sb-best{color:var(--gold);font-weight:700;}
  .stat-badge.active .sb-best{color:rgba(255,255,255,.85);}

  @media (max-width:480px){
    .lesson-grid{grid-template-columns:1fr;}
    .lesson-card[data-lesson="all"]{grid-column:auto;}
    .prompt-ja{font-size:1.35rem;}
    .card{padding:22px 18px 22px 56px;}
    .card::before{left:40px;}
    .ring-holes{left:12px;}
  }

  /* ---------- 苦手分析 ---------- */
  .wk-summary{font-size:.9rem;color:var(--ink-soft);margin:0 0 14px;}
  .wk-title{font-size:1rem;font-weight:900;margin:26px 0 6px;}
  .wk-note{font-size:.78rem;color:var(--ink-soft);margin:0 0 10px;}
  .wk-item{background:var(--card);border-left:4px solid var(--red);border-radius:8px;box-shadow:0 2px 8px var(--shadow);padding:10px 14px;margin-bottom:10px;}
  .wk-item .wk-ja{font-size:.9rem;color:var(--ink-soft);}
  .wk-item .wk-en{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.05rem;}
  .wk-item .wk-your{font-size:.82rem;color:var(--red);}
  .wk-item .wk-meta{font-size:.75rem;color:var(--ink-soft);margin-top:2px;}
  .wk-row{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:7px 0;}
  .wk-label{flex:0 0 38%;min-width:0;word-break:break-word;}
  .wk-bar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden;}
  .wk-bar > i{display:block;height:100%;background:var(--red);}
  .wk-num{flex:0 0 118px;text-align:right;font-family:'JetBrains Mono',monospace;}
  .wk-flag{color:var(--red);font-weight:700;}
  .wk-dim{color:#9ca3af;}
  .wk-actions{display:flex;flex-direction:column;gap:10px;margin-top:26px;}

  @media (prefers-reduced-motion:reduce){
    .mark path{transition:none !important;}
    .feedback{animation:none !important;}
    .lesson-card,.btn-primary,.btn-secondary{transition:none !important;}
  }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">NEW CROWN Lesson 1–3 ・ 期末テスト対策</p>

  <main id="app">

    <!-- ============ START SCREEN ============ -->
    <section id="screen-start" class="screen">
      <h1 class="title">英単語タイピング確認テスト</h1>
      <p class="lead">日本語の意味を見て、対応する英単語・熟語をタイピングしよう。レッスンを選んでスタート！</p>

      <div class="lesson-grid" id="lesson-grid"></div>

      <div id="elementary-categories" class="category-panel" hidden>
        <p id="category-panel-title">小学校のカテゴリーを選んでください</p>
        <div class="category-grid" id="category-grid"></div>
      </div>

      <div id="all-lesson-container" class="lesson-grid" style="margin-bottom:24px;"></div>

      <label class="shuffle-toggle">
        <input type="checkbox" id="shuffle-check">
        出題順をシャッフルする
      </label>

      <button id="history-btn" class="btn-primary" style="width:100%;margin-top:12px;">📊 履歴を見る</button>
      <button id="weak-btn" class="btn-secondary" style="width:100%;margin-top:10px;">📉 苦手分析</button>

      <div class="history-actions" style="margin-top:18px;justify-content:center;">
        <button id="btn-clear-history" class="btn-secondary">履歴をすべて削除</button>
      </div>
    </section>

    <!-- ============ QUIZ SCREEN ============ -->
    <section id="screen-quiz" class="screen" hidden>
      <div class="quiz-bar">
        <span id="quiz-lesson-label" class="lesson-tag-label"></span>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-count" class="progress-count"></span>
        <span class="score-label"><span id="score-correct" class="score-correct"></span><span id="score-wrong" class="score-wrong"></span></span>
      </div>

      <div class="card" id="quiz-card">
        <div class="ring-holes"><span></span><span></span><span></span></div>

        <div class="card-tags">
          <span id="tag-part" class="tag tag-blue"></span>
          <span id="tag-pos" class="tag tag-green"></span>
        </div>

        <p class="prompt-label">日本語の意味</p>
        <p id="prompt-ja" class="prompt-ja"></p>

        <div class="answer-row">
          <input id="answer-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="英語を入力してEnter">
          <svg id="mark-svg" class="mark" viewBox="0 0 120 120" aria-hidden="true"><path id="mark-path" d=""></path></svg>
        </div>

        <div id="feedback" class="feedback" hidden>
          <p class="feedback-answer">正解: <span class="ans" id="feedback-correct"></span></p>
          <p class="feedback-ex-en" id="feedback-ex-en"></p>
          <p class="feedback-ex-ja" id="feedback-ex-ja"></p>
          <p class="feedback-memo" id="feedback-memo" hidden></p>
        </div>

        <div class="quiz-actions">
          <button id="action-btn" class="btn-primary">こたえる</button>
        </div>
      </div>
    </section>

    <!-- ============ RESULT SCREEN ============ -->
    <section id="screen-result" class="screen" hidden>
      <h1 class="title">結果</h1>
      <div class="panel result-score">
        <p id="result-pct" class="result-pct"></p>
        <p id="result-fraction"></p>
        <p id="result-message"></p>
      </div>

      <div class="panel wrong-list" id="wrong-list-panel">
        <h2>もう一度確認しよう</h2>
        <div id="result-wrong-list"></div>
      </div>

      <div class="result-actions">
        <button id="btn-retry-wrong" class="btn-primary">間違えた問題だけもう一度</button>
        <button id="btn-retry-all" class="btn-secondary">もう一度すべて挑戦する</button>
        <button id="btn-view-history" class="btn-secondary">履歴を見る</button>
        <button id="btn-view-weak" class="btn-secondary">📉 苦手分析</button>
        <button id="btn-back-start" class="btn-secondary">レッスン選択に戻る</button>
      </div>
    </section>

    <!-- ============ HISTORY DETAIL SCREEN ============ -->
    <section id="screen-history" class="screen" hidden>
      <div class="history-detail-header">
        <h1 id="history-title">📊 テスト履歴</h1>
        <button id="btn-history-back" class="btn-secondary">戻る</button>
      </div>

      <button id="btn-history-weak" class="btn-secondary" style="width:100%;margin-bottom:16px;">📉 苦手分析</button>

      <div id="stats-container" class="progress-panel"></div>

      <div id="progress-container" class="progress-panel"></div>

      <div id="charts-container"></div>

      <div class="history-detail-list" id="history-detail-list"></div>

    <!-- ============ WEAK ANALYSIS SCREEN ============ -->
    <section id="screen-weak" class="screen" hidden>
      <div class="history-detail-header">
        <h1 class="title">📉 苦手分析</h1>
        <button id="btn-weak-back" class="btn-secondary">戻る</button>
      </div>

    </section>

  </main>
</div>

<script src="json/words-data.js"></script>
<script>
/* ============================================================
   Words data – loaded from json/words-data.js
============================================================ */
const WORDS = window.WORDS || [];

const POS_LABELS = {
  '名':'名詞','動':'動詞','形':'形容詞','副':'副詞','句':'連語・熟語',
  '短':'短縮形','前':'前置詞','代':'代名詞','否':'否定形'
};

const CIRCLE_PATH = "M 70 18 C 38 12, 14 32, 14 60 C 14 90, 40 102, 68 100 C 100 98, 106 64, 92 38 C 84 24, 76 19, 70 18";
const CROSS_PATH  = "M 18 18 L 102 102 M 100 18 L 16 102";

const screens = {
  start: document.getElementById('screen-start'),
  quiz: document.getElementById('screen-quiz'),
  result: document.getElementById('screen-result'),
  history: document.getElementById('screen-history'),
  weak: document.getElementById('screen-weak'),
};
function showScreen(name){
  for(const k in screens) screens[k].hidden = (k !== name);
}

const inputEl = document.getElementById('answer-input');
const actionBtn = document.getElementById('action-btn');
const feedbackEl = document.getElementById('feedback');
const markSvg = document.getElementById('mark-svg');
const markPath = document.getElementById('mark-path');
const shuffleCheck = document.getElementById('shuffle-check');

let state = {};

let currentHistoryFilter = null;  // for part-based filtering

function partLabel(part, lesson){
  if(lesson === 'elementary') return part;
  if(part === 'Goal Activity' || part === 'Introduction') return part;
  return 'Part ' + part;
}

function normalize(s){
  return s.normalize('NFKC').trim().toLowerCase()
    .replace(/[\u2019\u02BC\u00B4\u0060]/g, "'")
    .replace(/\s+/g,' ');
}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

/* ---- start screen: generate lesson buttons dynamically ---- */
function getLessonList(){
  const lessons = [...new Set(WORDS.map(w => w.lesson))];
  const specials = ['elementary'];
  // Check if lesson is a simple number (not like "1-1", "1-2", etc.)
  const isSimpleNumber = v => /^\d+$/.test(String(v));
  const isSplitLesson = v => /^\d+-\d+$/.test(String(v));
  const nums = lessons.filter(v => !specials.includes(v) && isSimpleNumber(v)).map(Number).sort((a,b)=>a-b);
  // Split lessons (1-1, 1-2, 1-3, 1-4) sorted by the number after the dash
  const splitLessons = lessons.filter(v => !specials.includes(v) && isSplitLesson(v)).sort((a,b)=>{
    const [aLesson, aPart] = a.split('-').map(Number);
    const [bLesson, bPart] = b.split('-').map(Number);
    if (aLesson !== bLesson) return aLesson - bLesson;
    return aPart - bPart;
  });
  const strLessons = lessons.filter(v => !specials.includes(v) && !isSimpleNumber(v) && !isSplitLesson(v) && v !== '').sort();
  const hasElem = lessons.includes('elementary');
  // Split lessons をレッスン番号ごとにグループ化（例: "1", "2", "3"）
  const lessonGroups = [...new Set(splitLessons.map(v => v.split('-')[0]))].sort((a,b)=>Number(a)-Number(b));
  return {nums, hasElem, strLessons, splitLessons, lessonGroups};
}

function allLessonLabel(){
  const {nums, hasElem, strLessons} = getLessonList();
  const parts = nums.map(n => 'Lesson ' + n);
  strLessons.forEach(s => {
    // Format split lessons like "1-1" as "Lesson 1-1"
    if (/^\d+-\d+$/.test(s)) {
      parts.push('Lesson ' + s);
    } else {
      parts.push(s);
    }
  });
  const str = parts.join('、') + (hasElem ? ' + 小学校' : '');
  return '全レッスン（' + str + '）';
}

/* ---- sub-selection panel (used for 小学校 categories AND Lesson1/2/3 parts) ---- */
function getElementaryCategories(){
  const parts = [...new Set(WORDS.filter(w => w.lesson === 'elementary').map(w => w.part))];
  return parts.filter(Boolean).sort();
}

function buildSubPanel(kind){
  const grid = document.getElementById('category-grid');
  const titleEl = document.getElementById('category-panel-title');
  grid.innerHTML = '';

  if(kind === 'elementary'){
    titleEl.textContent = '小学校のカテゴリーを選んでください';
    const cats = getElementaryCategories();
    const catCounts = {};
    WORDS.filter(w => w.lesson === 'elementary').forEach(w => {
      catCounts[w.part] = (catCounts[w.part] || 0) + 1;
    });

    const allBtn = document.createElement('button');
    allBtn.className = 'category-btn cat-all';
    allBtn.textContent = 'すべて（' + Object.values(catCounts).reduce((a,b)=>a+b, 0) + '）';
    allBtn.addEventListener('click', ()=> startQuiz('elementary'));
    grid.appendChild(allBtn);

    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'category-btn';
      btn.textContent = cat + '（' + (catCounts[cat] || 0) + '）';
      btn.addEventListener('click', ()=> startQuiz('elementary|' + cat));
      grid.appendChild(btn);
    });
  } else if(kind.startsWith('lesson:')){
    const lessonNum = kind.split(':')[1];
    titleEl.textContent = 'Lesson' + lessonNum + ' のパートを選んでください';

    const counts = {};
    WORDS.forEach(w => { counts[w.lesson] = (counts[w.lesson] || 0) + 1; });

    const lessonKeys = [...new Set(
      WORDS.filter(w => String(w.lesson).startsWith(lessonNum + '-')).map(w => w.lesson)
    )].sort((a,b) => Number(a.split('-')[1]) - Number(b.split('-')[1]));

    const totalCount = lessonKeys.reduce((sum,k) => sum + (counts[k] || 0), 0);

    const allBtn = document.createElement('button');
    allBtn.className = 'category-btn cat-all';
    allBtn.textContent = 'すべて（' + totalCount + '）';
    allBtn.addEventListener('click', ()=> startQuiz(lessonNum + '-all'));
    grid.appendChild(allBtn);

    lessonKeys.forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'category-btn';
      const partLabel = getSplitLessonLabel(key).replace('Lesson' + lessonNum + ' ', '');
      btn.textContent = partLabel + '（' + (counts[key] || 0) + '）';
      btn.addEventListener('click', ()=> startQuiz(key));
      grid.appendChild(btn);
    });
  }
}

function toggleSubPanel(kind){
  const panel = document.getElementById('elementary-categories');
  if(panel.hidden || panel.dataset.kind !== kind){
    buildSubPanel(kind);
    panel.hidden = false;
    panel.dataset.kind = kind;
  } else {
    panel.hidden = true;
    panel.dataset.kind = '';
  }
}

/* ---- split lesson label helper (works for any Lesson number, based on actual Part value) ---- */
function getSplitLessonLabel(lessonKey){
  const lessonNum = lessonKey.split('-')[0];
  const word = WORDS.find(w => String(w.lesson) === lessonKey);
  const part = word ? word.part : '';
  let partLabel;
  if (/^\d+$/.test(part)) {
    partLabel = 'Part' + part;
  } else if (part === 'Goal Activity') {
    partLabel = 'Goal Activity';
  } else if (part) {
    partLabel = part; // e.g. "Introduction"
  } else {
    partLabel = lessonKey.split('-')[1];
  }
  return 'Lesson' + lessonNum + ' ' + partLabel;
}

function generateLessonButtons(){
  const grid = document.getElementById('lesson-grid');
  grid.innerHTML = '';

  const {nums, hasElem, strLessons, splitLessons, lessonGroups} = getLessonList();
  const counts = {};
  let totalCount = 0;
  WORDS.forEach(w => { counts[w.lesson] = (counts[w.lesson] || 0) + 1; });

  // Split lessons があるLessonは「小学校」と同様に1つのボタン＋パート選択パネルにまとめる
  lessonGroups.forEach((lessonNum, i) => {
    const hue = (i * 40) % 360;
    const groupKeys = splitLessons.filter(k => k.split('-')[0] === lessonNum);
    const groupCount = groupKeys.reduce((sum,k) => sum + (counts[k] || 0), 0);
    const btn = document.createElement('button');
    btn.className = 'lesson-card';
    btn.dataset.lesson = lessonNum;
    btn.style.setProperty('--hue', hue);
    btn.innerHTML = '<span class="lesson-no">Lesson ' + lessonNum + '</span><span class="lesson-count">' + groupCount + '問／パートを選ぶ</span>';
    btn.addEventListener('click', ()=> toggleSubPanel('lesson:' + lessonNum));
    grid.appendChild(btn);
    totalCount += groupCount;
  });

  // Then add regular numbered lessons (2, 3, etc.)
  nums.forEach(lesson => {
    const hue = ((lesson - 1) * 40) % 360;
    const btn = document.createElement('button');
    btn.className = 'lesson-card';
    btn.dataset.lesson = lesson;
    btn.style.setProperty('--hue', hue);
    btn.innerHTML = '<span class="lesson-no">Lesson ' + lesson + '</span><span class="lesson-count">' + (counts[lesson] || 0) + '問</span>';
    btn.addEventListener('click', ()=> startQuiz(String(lesson)));
    grid.appendChild(btn);
    totalCount += (counts[lesson] || 0);
  });

  if(hasElem){
    const btn = document.createElement('button');
    btn.className = 'lesson-card';
    btn.dataset.lesson = 'elementary';
    btn.innerHTML = '<span class="lesson-no">小学校</span><span class="lesson-count">' + (counts['elementary'] || 0) + '問／カテゴリーを選ぶ</span>';
    btn.addEventListener('click', ()=> toggleSubPanel('elementary'));
    grid.appendChild(btn);
    totalCount += (counts['elementary'] || 0);
  }

  strLessons.forEach(lesson => {
    const hue = ((strLessons.indexOf(lesson) + nums.length + lessonGroups.length) * 40) % 360;
    const btn = document.createElement('button');
    btn.className = 'lesson-card';
    btn.dataset.lesson = lesson;
    btn.style.setProperty('--hue', hue);
    btn.innerHTML = '<span class="lesson-no">' + lesson + '</span><span class="lesson-count">' + (counts[lesson] || 0) + '問</span>';
    btn.addEventListener('click', ()=> startQuiz(lesson));
    grid.appendChild(btn);
    totalCount += (counts[lesson] || 0);
  });

  const btnAll = document.createElement('button');
  btnAll.className = 'lesson-card';
  btnAll.dataset.lesson = 'all';
  btnAll.innerHTML = '<span class="lesson-no">' + allLessonLabel() + '</span><span class="lesson-count">' + totalCount + '問</span>';
  btnAll.addEventListener('click', ()=> startQuiz('all'));
  const allContainer = document.getElementById('all-lesson-container');
  allContainer.appendChild(btnAll);
}

function buildPool(lessonFilter){
  let pool;
  let label;
  const pipeIdx = lessonFilter.indexOf('|');
  if(pipeIdx !== -1){
    // elementary|category format
    const lesson = lessonFilter.slice(0, pipeIdx);
    const category = lessonFilter.slice(pipeIdx + 1);
    pool = WORDS.filter(w => String(w.lesson) === lesson && w.part === category);
    label = '小学校 ・ ' + category;
  } else if(lessonFilter === 'all'){
    pool = WORDS.slice();
    label = allLessonLabel();
  } else if(lessonFilter === 'elementary'){
    pool = WORDS.filter(w => String(w.lesson) === 'elementary');
    label = '小学校';
  } else if(/^\d+-all$/.test(lessonFilter)){
    // "1-all" のようなLessonグループ全体（パート横断）
    const lessonNum = lessonFilter.split('-')[0];
    pool = WORDS.filter(w => String(w.lesson).startsWith(lessonNum + '-'));
    label = 'Lesson' + lessonNum + ' すべて';
  } else if(/^\d+-\d+$/.test(lessonFilter)){
    // Split lessons like "1-1", "2-1", "3-1"
    pool = WORDS.filter(w => String(w.lesson) === lessonFilter);
    label = getSplitLessonLabel(lessonFilter);
  } else if(isNaN(Number(lessonFilter))){
    pool = WORDS.filter(w => String(w.lesson) === lessonFilter);
    label = lessonFilter;
  } else {
    pool = WORDS.filter(w => String(w.lesson) === lessonFilter);
    label = 'Lesson ' + lessonFilter;
  }
  return {pool, label};
}

function startQuiz(lessonFilter){
  const {pool, label} = buildPool(lessonFilter);
  if(shuffleCheck.checked) shuffleArray(pool);
  state = {
    queue: pool,
    index: 0,
    score: 0,
    wrong: [],
    answered: false,
    lessonFilter: lessonFilter,
    lessonLabel: label
  };
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion(){
  const item = state.queue[state.index];

  document.getElementById('quiz-lesson-label').textContent = state.lessonLabel;
  document.getElementById('progress-fill').style.width = (state.index/state.queue.length*100) + '%';
  document.getElementById('progress-count').textContent = (state.index+1) + ' / ' + state.queue.length;
  document.getElementById('score-correct').textContent = '◯' + state.score;
  document.getElementById('score-wrong').textContent = '✗' + state.wrong.length;

  const showLessonNo = (state.lessonFilter === 'all');
  const lessonNum = isNaN(Number(item.lesson)) ? item.lesson : 'Lesson ' + item.lesson;
  document.getElementById('tag-part').textContent = showLessonNo
    ? (lessonNum + ' ・ ' + partLabel(item.part, item.lesson))
    : partLabel(item.part, item.lesson);
  document.getElementById('tag-pos').textContent = POS_LABELS[item.pos] || item.pos;
  document.getElementById('prompt-ja').textContent = item.ja;

  inputEl.value = '';
  inputEl.readOnly = false;
  inputEl.classList.remove('correct','incorrect');
  feedbackEl.hidden = true;
  markSvg.classList.remove('show','correct','incorrect');
  actionBtn.textContent = 'こたえる';
  actionBtn.disabled = false;
  state.answered = false;
  inputEl.focus();
}

function playMark(){
  markSvg.classList.add('show');
  const len = markPath.getTotalLength();
  markPath.style.transition = 'none';
  markPath.style.strokeDasharray = len;
  markPath.style.strokeDashoffset = len;
  markPath.getBoundingClientRect();
  markPath.style.transition = 'stroke-dashoffset .5s ease-out';
  markPath.style.strokeDashoffset = '0';
}

function submitAnswer(){
  const item = state.queue[state.index];
  const userVal = inputEl.value;
  const isCorrect = normalize(userVal) !== '' && normalize(userVal) === normalize(item.answer);

  markAttempted(item);
  recordWordStat(item, isCorrect, userVal);

  if(isCorrect){
    state.score++;
    inputEl.classList.add('correct');
    markPath.setAttribute('d', CIRCLE_PATH);
  } else {
    state.wrong.push(item);
    inputEl.classList.add('incorrect');
    markPath.setAttribute('d', CROSS_PATH);
  }
  inputEl.readOnly = true;
  playMark();

  document.getElementById('feedback-correct').textContent = item.answer;
  document.getElementById('feedback-ex-en').textContent = item.ex_en;
  document.getElementById('feedback-ex-ja').textContent = item.ex_ja;
  const memoEl = document.getElementById('feedback-memo');
  if(item.memo){
    memoEl.textContent = '💡 ' + item.memo;
    memoEl.hidden = false;
  } else {
    memoEl.hidden = true;
  }
  feedbackEl.hidden = false;

  document.getElementById('score-correct').textContent = '◯' + state.score;
  document.getElementById('score-wrong').textContent = '✗' + state.wrong.length;

  actionBtn.textContent = (state.index+1 < state.queue.length) ? 'つぎへ' : '結果を見る';
  state.answered = true;
}

function nextQuestion(){
  state.index++;
  if(state.index >= state.queue.length){
    document.getElementById('progress-fill').style.width = '100%';
    showResult();
  } else {
    renderQuestion();
  }
}

actionBtn.addEventListener('click', ()=>{
  if(!state.answered) submitAnswer(); else nextQuestion();
});
inputEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    if(!state.answered) submitAnswer(); else nextQuestion();
  }
});

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function showResult(){
  showScreen('result');
  const total = state.queue.length;
  const correct = state.score;
  const pct = total ? Math.round(correct/total*100) : 0;
  document.getElementById('result-pct').innerHTML = '正答率 <span class="pct-num">' + pct + '</span>%';
  document.getElementById('result-fraction').textContent = total + '問中 ' + correct + '問正解';
  let msg;
  if(pct === 100) msg = 'パーフェクト！すべて完璧です。';
  else if(pct >= 80) msg = 'よくできました！この調子で復習しよう。';
  else if(pct >= 60) msg = 'もう少し！間違えた問題を見直そう。';
  else msg = 'まだ伸ばせるところがあるよ。間違えた問題を確認しよう。';
  document.getElementById('result-message').textContent = msg;

  const listEl = document.getElementById('result-wrong-list');
  const panel = document.getElementById('wrong-list-panel');
  listEl.innerHTML = '';
  if(state.wrong.length === 0){
    panel.hidden = true;
  } else {
    panel.hidden = false;
    state.wrong.forEach(item=>{
      const div = document.createElement('div');
      div.className = 'wrong-item';
      div.innerHTML = '<span class="ja">'+escapeHtml(item.ja)+'</span><span class="en">'+escapeHtml(item.answer)+'</span>';
      listEl.appendChild(div);
    });
  }
  document.getElementById('btn-retry-wrong').hidden = (state.wrong.length === 0);
  saveHistory(state.lessonLabel, state.queue.length, state.score, state.wrong.length);
}

document.getElementById('btn-retry-wrong').addEventListener('click', ()=>{
  let pool = state.wrong.slice();
  if(shuffleCheck.checked) shuffleArray(pool);
  state = {
    queue: pool, index:0, score:0, wrong:[], answered:false,
    lessonFilter: state.lessonFilter, lessonLabel: state.lessonLabel
  };
  showScreen('quiz');
  renderQuestion();
});
document.getElementById('btn-retry-all').addEventListener('click', ()=>{
  startQuiz(state.lessonFilter);
});
document.getElementById('btn-back-start').addEventListener('click', ()=>{
  showScreen('start');
});
document.getElementById('btn-view-history').addEventListener('click', ()=>{
  showHistoryScreen(0); // 直前に保存された結果（先頭=最新）をハイライト表示
});

/* ---- History functions ---- */
const HISTORY_KEY = 'typingHistory';
const WORDSTATS_KEY = 'typingWordStats';
const MAX_HISTORY = 50;

function saveHistory(lessonLabel, total, correct, wrong){
  const history = getHistory();
  const entry = {
    date: new Date().toISOString(),
    lesson: lessonLabel,
    total: total,
    correct: correct,
    wrong: wrong,
    pct: total ? Math.round(correct/total*100) : 0
  };
  history.unshift(entry);
  if(history.length > MAX_HISTORY) history.length = MAX_HISTORY;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  recordCompletion(lessonLabel, entry.pct, entry.date); // 履歴の上限(50件)で消えても着手済み判定が消えないように別途記録
  renderHistory(); // スタート画面の履歴表示をリロードなしで即時更新
}

function getHistory(){
  const stored = localStorage.getItem(HISTORY_KEY);
  return stored ? JSON.parse(stored) : [];
}

/* ---- 進捗バッジ用: カテゴリー/レッスン単位の「着手済み」記録（historyのように50件で古いものが消えない） ---- */
const COMPLETION_KEY = 'typingCompletion';

function loadCompletionMap(){
  try{
    const raw = localStorage.getItem(COMPLETION_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    console.warn('進捗完了記録の読み込みに失敗しました:', e);
    return {};
  }
}

function recordCompletion(lessonLabel, pct, dateIso){
  try{
    const map = loadCompletionMap();
    const prev = map[lessonLabel];
    map[lessonLabel] = {
      date: dateIso,
      pct: pct,
      count: (prev ? prev.count : 0) + 1
    };
    localStorage.setItem(COMPLETION_KEY, JSON.stringify(map));
  }catch(e){
    console.warn('進捗完了記録の保存に失敗しました:', e);
  }
}

function deleteHistory(index){
  const history = getHistory();
  history.splice(index, 1);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderHistory();
}

function clearHistory(){
  localStorage.removeItem(HISTORY_KEY);
  localStorage.removeItem(ATTEMPTED_KEY);
  localStorage.removeItem(COMPLETION_KEY);
  localStorage.removeItem(WORDSTATS_KEY);
  renderHistory();
}

/* ---- 出題済み問題の記録 (どの問題に「手を付けた」か) ---- */
const ATTEMPTED_KEY = 'typingAttempted';

function getWordKey(item){
  return item.lesson + '||' + item.part + '||' + item.ja + '||' + item.answer;
}

function loadAttempted(){
  try{
    const raw = localStorage.getItem(ATTEMPTED_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }catch(e){
    console.warn('進捗の読み込みに失敗しました:', e);
    return new Set();
  }
}

function markAttempted(item){
  try{
    const attempted = loadAttempted();
    attempted.add(getWordKey(item));
    localStorage.setItem(ATTEMPTED_KEY, JSON.stringify([...attempted]));
  }catch(e){
    console.warn('進捗の保存に失敗しました:', e);
  }
}

function formatDate(isoString){
  const d = new Date(isoString);
  const month = d.getMonth() + 1;
  const day = d.getDate();
  const hour = d.getHours().toString().padStart(2, '0');
  const min = d.getMinutes().toString().padStart(2, '0');
  return `${month}/${day} ${hour}:${min}`;
}

function renderHistory(){
  // Top page now has only a button to open history screen. No list to render.
}

/* ---- History detail screen ---- */
function showHistoryScreen(highlightIndex){
  showScreen('history');
  const history = getHistory();
  renderStatsSection(history, highlightIndex);
  renderProgress(history);
  if(history.length === 0){
    document.getElementById('charts-container').innerHTML = '<p class="chart-empty">履歴がありません</p>';
    document.getElementById('history-detail-list').innerHTML = '';
    return;
  }
  const filter = currentHistoryFilter;
  const filteredHistory = filter
    ? history.filter(h => h.lesson === filter.lesson)
    : history;
  renderPerLessonCharts(filteredHistory, highlightIndex);
  renderHistoryDetailList(filteredHistory, highlightIndex, filter ? '（フィルター適用中）' : '');
}

/* ---- progress panel: どのレッスン/カテゴリーに着手済みかを一覧表示 ---- */
function getProgressItems(){
  const {nums, strLessons, lessonGroups, hasElem} = getLessonList();
  const items = [];

  lessonGroups.forEach(lessonNum => {
    const lessonKeys = [...new Set(
      WORDS.filter(w => String(w.lesson).startsWith(lessonNum + '-')).map(w => w.lesson)
    )].sort((a,b) => Number(a.split('-')[1]) - Number(b.split('-')[1]));
    lessonKeys.forEach(key => {
      const fullLabel = getSplitLessonLabel(key);
      items.push({
        group: 'Lesson' + lessonNum,
        badgeLabel: fullLabel.replace('Lesson' + lessonNum + ' ', ''),
        matchLabels: [fullLabel, 'Lesson' + lessonNum + ' すべて'],
        filter: key
      });
    });
  });

  nums.forEach(n => {
    items.push({
      group: 'その他のレッスン',
      badgeLabel: 'Lesson ' + n,
      matchLabels: ['Lesson ' + n],
      filter: String(n)
    });
  });

  if(hasElem){
    getElementaryCategories().forEach(cat => {
      items.push({
        group: '小学校',
        badgeLabel: cat,
        matchLabels: ['小学校 ・ ' + cat, '小学校'],
        filter: 'elementary|' + cat
      });
    });
  }

  strLessons.forEach(s => {
    items.push({
      group: 'その他のレッスン',
      badgeLabel: s,
      matchLabels: [s],
      filter: s
    });
  });

  return items;
}

function getItemStatus(item, history, allLabel){
  const map = loadCompletionMap();
  const labels = [allLabel, ...item.matchLabels];
  const records = labels.map(l => map[l]).filter(Boolean);
  if(records.length === 0) return {done:false};
  records.sort((a,b) => new Date(b.date) - new Date(a.date));
  const count = records.reduce((sum, r) => sum + r.count, 0);
  return {done:true, latest: records[0], count: count};
}

function drawSingleChart(canvas, sorted, highlightIndex){
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = rect.width || 600;
  const h = w * 0.5;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { top: 20, right: 20, bottom: 40, left: 44 };
  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;

  // Clear
  ctx.clearRect(0, 0, w, h);

  // Background
  ctx.fillStyle = '#fffdf8';
  ctx.fillRect(0, 0, w, h);

  // Y-axis grid lines (0, 20, 40, 60, 80, 100)
  ctx.strokeStyle = '#e3d8c3';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  for(let pct = 0; pct <= 100; pct += 20){
    const y = pad.top + chartH * (1 - pct / 100);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Y-axis labels
  ctx.fillStyle = '#7d869a';
  ctx.font = '11px "Zen Maru Gothic", sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for(let pct = 0; pct <= 100; pct += 20){
    const y = pad.top + chartH * (1 - pct / 100);
    ctx.fillText(pct + '%', pad.left - 6, y);
  }

  // X-axis labels (show at most 6 labels)
  const maxLabels = Math.min(sorted.length, 6);
  const labelStep = Math.max(1, Math.floor(sorted.length / maxLabels));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for(let i = 0; i < sorted.length; i++){
    if(i % labelStep !== 0 && i !== sorted.length - 1) continue;
    const x = pad.left + (i / (sorted.length - 1 || 1)) * chartW;
    ctx.fillText(formatDate(sorted[i].entry.date), x, h - pad.bottom + 8);
  }

  // Draw line
  if(sorted.length < 2){
    // Single point: just draw a dot
    const x = pad.left + chartW / 2;
    const y = pad.top + chartH * (1 - sorted[0].entry.pct / 100);
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#c99a3b';
    ctx.fill();
    return;
  }

  // Line path
  ctx.beginPath();
  for(let i = 0; i < sorted.length; i++){
    const x = pad.left + (i / (sorted.length - 1)) * chartW;
    const y = pad.top + chartH * (1 - sorted[i].entry.pct / 100);
    if(i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#c99a3b';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Fill area under line
  ctx.beginPath();
  for(let i = 0; i < sorted.length; i++){
    const x = pad.left + (i / (sorted.length - 1)) * chartW;
    const y = pad.top + chartH * (1 - sorted[i].entry.pct / 100);
    if(i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.lineTo(pad.left + chartW, pad.top + chartH);
  ctx.lineTo(pad.left, pad.top + chartH);
  ctx.closePath();
  ctx.fillStyle = 'rgba(201,154,59,0.10)';
  ctx.fill();

  // Draw markers
  for(let i = 0; i < sorted.length; i++){
    const x = pad.left + (i / (sorted.length - 1)) * chartW;
    const y = pad.top + chartH * (1 - sorted[i].entry.pct / 100);
    const isHighlight = (sorted[i].origIdx === highlightIndex);
    ctx.beginPath();
    ctx.arc(x, y, isHighlight ? 7 : 4.5, 0, Math.PI * 2);
    ctx.fillStyle = isHighlight ? '#d6473c' : '#c99a3b';
    ctx.fill();
    if(isHighlight){
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    // Label for highlighted point
    if(isHighlight){
      ctx.fillStyle = '#2f3b52';
      ctx.font = 'bold 12px "Zen Maru Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(sorted[i].entry.pct + '%', x, y - 10);
    }
  }
}

/* ---- Part-based statistics with click-to-filter ---- */
function getPartStatistics(history){
  const stats = {};
  history.forEach(h => {
    const key = h.lesson;
    if(!stats[key]){
      stats[key] = {
        lesson: h.lesson,
        attempts: 0,
        totalPct: 0,
        bestPct: 0
      };
    }
    stats[key].attempts++;
    stats[key].totalPct += h.pct;
    if(h.pct > stats[key].bestPct){
      stats[key].bestPct = h.pct;
    }
  });

  return Object.values(stats).map(s => ({
    ...s,
    avgPct: Math.round(s.totalPct / s.attempts)
  })).sort((a, b) => {
    // Sort: split lessons (1-1 etc.) by lesson number then part, numbered lessons after, then string/special
    const sortKey = v => {
      if(/^\d+-\d+$/.test(v.lesson)){
        const [l, p] = v.lesson.split('-').map(Number);
        return [0, l, p];
      }
      if(/^\d+$/.test(v.lesson)){
        return [1, Number(v.lesson), 0];
      }
      if(v.lesson === 'elementary'){
        return [3, 0, 0];
      }
      return [2, 0, 0, v.lesson];
    };
    const ka = sortKey(a), kb = sortKey(b);
    for(let i = 0; i < Math.max(ka.length, kb.length); i++){
      const ai = ka[i] ?? 0, bi = kb[i] ?? 0;
      if(ai !== bi) return ai - bi;
    }
    return 0;
  });
}

function migrateCompletionFromHistory(){

}

/* ============================================================
   問題単位の記録 と 苦手分析
============================================================ */
function loadWordStats(){
  try{
    const raw = localStorage.getItem(WORDSTATS_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    console.warn('問題別記録の読み込みに失敗しました:', e);
    return {};
  }
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m === 0) return n;
  if(n === 0) return m;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for(let i=1;i<=m;i++){
    const cur = [i];
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

// 隣り合う文字の入れ替えも1回と数える距離（Optimal String Alignment）
function osaDistance(a, b){
  const m = a.length, n = b.length;
  const d = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) d[i][0] = i;
  for(let j=0;j<=n;j++) d[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
      if(i>1 && j>1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]){
        d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1);
      }
    }
  }
  return d[m][n];
}

const ERR_EMPTY   = '空欄（未回答）';
const ERR_SYMBOL  = '記号・スペースのミス（\' . - など）';
const ERR_ORDER   = '語順違い（熟語）';
const ERR_MISSING = '語の欠落（熟語）';
const ERR_EXTRA_W = '余分な語（熟語）';
const ERR_ENDING  = '語尾の違い（-s / -ed / -ing など）';
const ERR_DROP    = '1文字の脱字';
const ERR_EXTRA_C = '1文字の余分';
const ERR_SWAP    = '隣り合う文字の入れ替え';
const ERR_SUBST   = '1文字の打ち間違い';
const ERR_MULTI   = '複数文字の綴りミス（惜しい）';
const ERR_OTHER   = '別の単語・うろ覚え';

function classifyTypingError(user, answer){
  const u = normalize(user || '');
  const a = normalize(answer || '');
  if(u === '') return ERR_EMPTY;

  const strip = (x) => x.replace(/[\s'".,!?;:\-~]/g, '');
  const us = strip(u), as = strip(a);
  if(us === as) return ERR_SYMBOL;

  const ut = u.split(' ').filter(Boolean), at = a.split(' ').filter(Boolean);
  if(ut.length > 1 || at.length > 1){
    if(ut.length === at.length && [...ut].sort().join(' ') === [...at].sort().join(' ')) return ERR_ORDER;
    const count = (arr) => arr.reduce((m, w) => { m[w] = (m[w]||0) + 1; return m; }, {});
    const isSubset = (x, y) => { const cy = count(y); return x.every(w => (cy[w] > 0) ? (cy[w]--, true) : false); };
    if(ut.length < at.length && isSubset(ut, at)) return ERR_MISSING;
    if(ut.length > at.length && isSubset(at, ut)) return ERR_EXTRA_W;
  }

  const shorter = us.length <= as.length ? us : as;
  const longer  = us.length <= as.length ? as : us;
  if(shorter.length >= 3 && longer.startsWith(shorter) &&
     /^(s|es|d|ed|ing|er|est|ly|y|ness|ful)$/.test(longer.slice(shorter.length))) return ERR_ENDING;

  const osa = osaDistance(us, as);
  if(osa === 1){
    if(levenshtein(us, as) === 2) return ERR_SWAP;
    if(us.length < as.length) return ERR_DROP;
    if(us.length > as.length) return ERR_EXTRA_C;
    return ERR_SUBST;
  }
  if(as.length >= 4 && osa <= Math.max(2, Math.floor(as.length * 0.4))) return ERR_MULTI;
  return ERR_OTHER;
}

function recordWordStat(item, correct, userAnswer){
  try{
    const stats = loadWordStats();
    const key = getWordKey(item);
    const now = new Date().toISOString();
    const rec = stats[key] || {
      lesson: item.lesson, part: item.part, answer: item.answer, ja: item.ja, pos: item.pos,
      attempts: 0, wrong: 0, lastAt: null, lastWrongAt: null, wrongAnswers: [], errorTypes: {}
    };
    rec.attempts += 1;
    rec.lastAt = now;
    if(!correct){
      rec.wrong += 1;
      rec.lastWrongAt = now;
      rec.wrongAnswers = [...(rec.wrongAnswers || []), userAnswer].slice(-5);
      const type = classifyTypingError(userAnswer, item.answer);
      rec.errorTypes = rec.errorTypes || {};
      rec.errorTypes[type] = (rec.errorTypes[type] || 0) + 1;
    }
    stats[key] = rec;
    localStorage.setItem(WORDSTATS_KEY, JSON.stringify(stats));
  }catch(e){
    console.warn('問題別記録の保存に失敗しました:', e);
  }
}

// 単語の特徴（正解の綴りから判定）
const WORD_FEATURES = [
  { label: '熟語（スペースを含む）',        test: r => /\s/.test(r.answer.trim()) },
  { label: '1語の単語',                     test: r => !/\s/.test(r.answer.trim()) },
  { label: '短い（1〜4文字）',              test: r => r.answer.replace(/[^A-Za-z]/g, '').length <= 4 },
  { label: '中くらい（5〜7文字）',          test: r => { const n = r.answer.replace(/[^A-Za-z]/g, '').length; return n >= 5 && n <= 7; } },
  { label: '長い（8文字以上）',             test: r => r.answer.replace(/[^A-Za-z]/g, '').length >= 8 },
  { label: '記号を含む（\' . - など）',      test: r => /['.\-]/.test(r.answer) },
  { label: '同じ文字が連続（ll, ss, tt など）', test: r => /([a-z])\1/i.test(r.answer) },
  { label: 'ie / ei を含む',                test: r => /ie|ei/i.test(r.answer) },
  { label: 'gh / ph を含む',                test: r => /gh|ph/i.test(r.answer) },
  { label: '-tion / -sion で終わる',        test: r => /(tion|sion)s?$/i.test(r.answer.trim()) },
];

function exportWordStatsJson(){
  const data = {
    exportedAt: new Date().toISOString(),
    wordstats: loadWordStats(),
    history: getHistory(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'english-typing-stats-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function wordSourceLabel(r){
  if(String(r.lesson) === 'elementary') return '小学校 ・ ' + r.part;
  if(/^\d+-\d+$/.test(String(r.lesson))) return getSplitLessonLabel(String(r.lesson));
  return 'Lesson ' + r.lesson;
}

function showWeakScreen(){
  showScreen('weak');
  const box = document.getElementById('weak-container');
  const stats = loadWordStats();
  const recs = Object.values(stats);

  if(recs.length === 0){
    box.innerHTML = '<div class="panel"><p class="wk-note" style="margin:0;">まだ問題別の記録がありません。テストを解くと、ここに間違えた単語と傾向が表示されます。<br>（記録は、この機能の追加後に解いた分から貯まります）</p></div>';
    return;
  }

  const MIN = 3;
  const totalAttempts = recs.reduce((x, r) => x + r.attempts, 0);
  const totalWrong = recs.reduce((x, r) => x + r.wrong, 0);
  const baseRate = totalAttempts > 0 ? totalWrong / totalAttempts : 0;
  const pctStr = (x) => Math.round(x * 100) + '%';

  const rateRow = (label, attempts, wrong) => {
    if(attempts < MIN){
      return '<div class="wk-row wk-dim"><div class="wk-label">' + escapeHtml(label) + '</div><div class="wk-bar"></div><div class="wk-num">データ不足 (' + wrong + '/' + attempts + ')</div></div>';
    }
    const rate = wrong / attempts;
    const flag = rate - baseRate >= 0.10;
    return '<div class="wk-row"><div class="wk-label' + (flag ? ' wk-flag' : '') + '">' + (flag ? '▲ ' : '') + escapeHtml(label) + '</div>' +
      '<div class="wk-bar"><i style="width:' + Math.round(rate * 100) + '%"></i></div>' +
      '<div class="wk-num">' + pctStr(rate) + ' (' + wrong + '/' + attempts + ')</div></div>';
  };
  const sortByRate = (list) => list.sort((x, y) => {
    const xd = x.attempts < MIN, yd = y.attempts < MIN;
    if(xd !== yd) return xd ? 1 : -1;
    return (y.wrong / y.attempts) - (x.wrong / x.attempts);
  });

  // (a) 間違い回数ランキング
  const ranking = recs.filter(r => r.wrong > 0).sort((x, y) =>
    y.wrong - x.wrong ||
    (y.wrong / y.attempts) - (x.wrong / x.attempts) ||
    String(y.lastWrongAt).localeCompare(String(x.lastWrongAt))
  ).slice(0, 30);
  const rankingHtml = ranking.length === 0
    ? '<p class="wk-note">間違えた単語はまだありません。</p>'
    : ranking.map((r, i) => {
        const last = (r.wrongAnswers && r.wrongAnswers.length) ? r.wrongAnswers[r.wrongAnswers.length - 1] : '';
        const types = Object.entries(r.errorTypes || {}).map(([k, v]) => k + '×' + v).join(' / ');
        return '<div class="wk-item">' +
          '<div class="wk-ja">' + (i + 1) + '. ' + escapeHtml(r.ja) + '</div>' +
          '<div class="wk-en">' + escapeHtml(r.answer) + '</div>' +
          '<div class="wk-your">直近の誤答: ' + escapeHtml(last || '（未回答）') + '</div>' +
          '<div class="wk-meta">❌ ' + r.wrong + '回 / ' + r.attempts + '回出題（' + escapeHtml(wordSourceLabel(r)) + '）' + (types ? ' ・ ' + escapeHtml(types) : '') + '</div>' +
          '</div>';
      }).join('');

  // (b) パート/カテゴリー別
  const groups = {};
  recs.forEach(r => {
    const k = r.lesson + '||' + r.part;
    if(!groups[k]) groups[k] = { label: wordSourceLabel(r), attempts: 0, wrong: 0 };
    groups[k].attempts += r.attempts;
    groups[k].wrong += r.wrong;
  });
  const groupHtml = sortByRate(Object.values(groups)).map(g => rateRow(g.label, g.attempts, g.wrong)).join('');

  // (c) 誤答タイプ別
  const typeCount = {};
  recs.forEach(r => Object.entries(r.errorTypes || {}).forEach(([k, v]) => { typeCount[k] = (typeCount[k] || 0) + v; }));
  const typeList = Object.entries(typeCount).sort((x, y) => y[1] - x[1]);
  const typeTotal = typeList.reduce((x, [, v]) => x + v, 0);
  const typeHtml = typeList.length === 0
    ? '<p class="wk-note">誤答の記録がありません。</p>'
    : typeList.map(([k, v]) =>
        '<div class="wk-row"><div class="wk-label">' + escapeHtml(k) + '</div>' +
        '<div class="wk-bar"><i style="width:' + Math.round(v / typeTotal * 100) + '%"></i></div>' +
        '<div class="wk-num">' + v + '件 (' + pctStr(v / typeTotal) + ')</div></div>'
      ).join('');

  // (d) 品詞別
  const posRows = {};
  recs.forEach(r => {
    const label = POS_LABELS[r.pos] || r.pos || '（品詞なし）';
    if(!posRows[label]) posRows[label] = { label, attempts: 0, wrong: 0 };
    posRows[label].attempts += r.attempts;
    posRows[label].wrong += r.wrong;
  });
  const posHtml = sortByRate(Object.values(posRows)).map(g => rateRow(g.label, g.attempts, g.wrong)).join('');

  // (e) 綴り・形の特徴別
  const featRows = WORD_FEATURES.map(f => {
    let attempts = 0, wrong = 0;
    recs.forEach(r => { if(f.test(r)){ attempts += r.attempts; wrong += r.wrong; } });
    return { label: f.label, attempts, wrong };
  }).filter(f => f.attempts > 0);
  const featHtml = sortByRate(featRows).map(f => rateRow(f.label, f.attempts, f.wrong)).join('');

  box.innerHTML =
    '<p class="wk-summary">記録済み ' + recs.length + '語 ／ 回答 ' + totalAttempts + '回 ／ 誤答 ' + totalWrong + '回（全体の誤答率 ' + pctStr(baseRate) + '）</p>' +
    '<div class="wk-title">間違い回数ランキング（上位30語）</div>' + rankingHtml +
    '<div class="wk-title">パート/カテゴリー別の誤答率</div>' +
    '<p class="wk-note">▲ は全体の誤答率より10ポイント以上高い項目。回答3回未満は「データ不足」</p>' + groupHtml +
    '<div class="wk-title">誤答タイプ別</div>' +
    '<p class="wk-note">自動判定のため目安です</p>' + typeHtml +
    '<div class="wk-title">品詞別の誤答率</div>' + posHtml +
    '<div class="wk-title">綴り・形の特徴別の誤答率</div>' +
    '<p class="wk-note">1語が複数の特徴に当てはまることがあります</p>' + featHtml +
    '<div class="wk-actions">' +
      '<button id="btn-weak-export" class="btn-secondary">⬇ JSONエクスポート</button>' +
      '<button id="btn-weak-back2" class="btn-secondary">戻る</button>' +
    '</div>';
  document.getElementById('btn-weak-export').addEventListener('click', exportWordStatsJson);
  document.getElementById('btn-weak-back2').addEventListener('click', () => showScreen('start'));
}

document.getElementById('btn-weak-back').addEventListener('click', () => showScreen('start'));

  if(confirm('履歴と問題別の記録（苦手分析のデータ）をすべて削除しますか？')){
    clearHistory();
  }
});
